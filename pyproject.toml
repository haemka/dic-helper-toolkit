[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dic-helper-toolkit"
version = "1.0.6"
description = "Helper libraries for the daily tasks of German MII/NUM Data Integration Centers"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "haemka", email = "github@haemka.net" }]
maintainers = [{ name = "haemka", email = "github@haemka.net" }]
keywords = ["fhir", "hl7", "http", "oauth", "mii", "num", "data integration center"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.34.2",
    "requests-oauthlib>=2.0.0",
    "oauthlib>=3.3.1",
    "fhir.resources>=8.2.0",
    "certifi>=2026.5.20",
    "charset-normalizer>=3.4.7",
    "pydantic>=2.13.4",
    "typing-extensions>=4.15.0",
    "typing-inspection>=0.4.2",
]

[project.optional-dependencies]
# Reading FHIR XML with dic_helpers.fhir_file_reader
xml = [
    "lxml~=6.1"
]
tests = [
    "pytest",
    "responses",
    "lxml~=6.1"
]

[project.urls]
Repository = "https://github.com/haemka/dic-helper-toolkit"
Issues = "https://github.com/haemka/dic-helper-toolkit/issues"

[tool.setuptools]
packages = {find = {include = ["dic_helpers*"]}}
