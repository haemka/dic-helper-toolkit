image: python:latest

stages:
  - build
  - test
  - publish

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"  # New cache location for uv
  UV_PUBLISH_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"

before_script:
  - python --version
  - pip install uv

build:
  stage: build
  tags:
    - python
  script:
    - uv build
  artifacts:
    paths:
      - dist/

test:
  stage: test
  tags:
    - python
  script:
    - uv venv .venv
    - source .venv/bin/activate
    - uv pip install pytest responses
    - uv pip install dist/*.whl
    - pytest tests/

publish:
  stage: publish
  tags:
    - python
  script:
    - uv publish dist/*.whl 
      --username gitlab-ci-token
      --password ${CI_JOB_TOKEN}
  rules:
    - if: $CI_COMMIT_TAG
